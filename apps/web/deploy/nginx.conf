# Server of the web (docs/08), the same for every environment. It answers
# like `vite preview` (docs/07 §12): each page also without the final `/`,
# without redirecting, and an unknown address gets «Page not found» in its
# language, with the status 404. It also serves the reference of the
# packages, in /reference/, and passes /api/ to the API (docs/09 §2).

# What changes per environment: $environment_robots_tag (environments/).
include /etc/nginx/environment.conf;

# The API reference is never indexed; the web, as its environment says.
# An empty value sends no header.
map $uri $robots_tag {
    ~^/reference(/|$)  "noindex";
    default            $environment_robots_tag;
}

# «Page not found» of the address's first segment if it is a language
# (/es/anything → /es/404.html); the English one otherwise.
map $uri $not_found_page {
    ~^/(?<section>[^/]+)/  /$section/404.html;
    default                /404.html;
}

# The address of each visitor, for the limit of /api/: the one Cloudflare
# sends, which it always overwrites. Any source may send it because the
# firewall of the machine only lets Nginx Proxy Manager reach this server
# (docs/08 §7).
real_ip_header CF-Connecting-IP;
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;

# The limit of the API (docs/09 §2): 10 requests per second and visitor on
# average, with bursts of 20, and then 429.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

# The API of this machine, resolved on each request by the DNS of Docker:
# Nginx starts without it, and the web works while it is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /srv/site;

    # The types of the image, and the manifest's, which they lack.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    server_tokens off;
    # Relative redirects: the proxy in front decides the scheme and the host.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json
               application/manifest+json image/svg+xml text/xml text/plain;

    # Every response, errors included: whether it is indexed, and the pages,
    # the service worker and the catalog are always revalidated, so that a
    # new version reaches the browser (docs/08). A location with its own
    # add_header drops these, so it repeats them.
    add_header X-Robots-Tag $robots_tag always;
    add_header Cache-Control "no-cache" always;

    # A file name is not an address: /es/index.html → /es/ (docs/07 §12).
    if ($request_uri ~ "^([^?]*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }
    # «Page not found» is not an address either.
    if ($request_uri ~ "^[^?]*/404\.html(\?.*)?$") {
        return 404;
    }

    error_page 404 @not_found;

    location @not_found {
        try_files $not_found_page /404.html =404;
    }

    # A page with the final `/`. Without this, a folder without its own
    # index.html (/assets/) would answer 403 instead of 404.
    location ~ /$ {
        try_files ${uri}index.html =404;
    }

    # A file, or a page without the final `/` (/es → /es/index.html).
    location / {
        try_files $uri $uri/index.html =404;
    }

    # The reference's pages link to each other with relative addresses, so
    # its home needs the final `/`.
    location = /reference {
        return 301 /reference/;
    }

    # The API (docs/09 §2), with its own headers: it decides its cache, and
    # it is never indexed.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        # The original host, which decides where the API reference is served
        # (REFERENCE_HOSTS, docs/09 §5), and the visitor's address.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Its responses are compressed too, as the web's files.
        gzip_proxied any;
        proxy_hide_header X-Robots-Tag;
        add_header X-Robots-Tag "noindex" always;
        set $api http://api:3000;
        proxy_pass $api;
    }

    # Hashed names: they change whenever their content does.
    location ^~ /assets/ {
        add_header X-Robots-Tag $robots_tag always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
