<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Before any CSS: the browser paints the page in the right theme from
         the start, instead of white until the stylesheet loads. The theme
         script changes it to the saved choice. -->
    <meta name="color-scheme" content="light dark" />
    <!--app-csp-->
    <!--app-head-->
    <meta
      name="theme-color"
      content="#f6f7f9"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121417"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!--app-theme-->
    <noscript>
      <style>
        /* !important: the app's stylesheet loads after this. */
        .panel[data-inactive] {
          display: block !important;
        }
        .wheel-host,
        .tabs,
        .legend,
        .toolbar {
          display: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--app-data-->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
