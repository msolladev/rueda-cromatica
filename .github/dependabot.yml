version: 2
# Every update goes through the preproduction before reaching main (docs/08).
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: preprod
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/verify]
    target-branch: preprod
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The web's Nginx image, pinned by version and digest.
  - package-ecosystem: docker
    directory: /apps/web/deploy
    target-branch: preprod
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The PostgreSQL image of development and the CI (apps/api), pinned by
  # version and digest. A new major version needs its data migrated, so it is
  # a decision of its own, not an update.
  - package-ecosystem: docker-compose
    directory: /apps/api
    target-branch: preprod
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
