name: Deploy

# Verifies a deployed branch with its environment's origin and, if it
# passes, deploys it to that environment (docs/08). ci.yml calls it with each
# push to a deployed branch.
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment, which names the runner's label and the server's configuration (apps/web/deploy/environments/).
        required: true
        type: string
      tag-release:
        description: Tags the deployed commit as a release (docs/03 §7). The caller must grant `contents write`.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # The same verification as the pull requests, built with the environment's
  # origin. Its `dist` is what the deploy serves, without building it again
  # (ADR-0011).
  verify:
    runs-on: ubuntu-26.04
    # The environment's variables, without recording a deployment.
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    concurrency:
      group: verify-${{ inputs.environment }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: build-catalog compares the IDs with the
          # catalog of the latest release tag (docs/03 §7).
          fetch-depth: 0
      - uses: ./.github/actions/verify
        with:
          site-origin: ${{ vars.SITE_ORIGIN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: |
            apps/web/dist/
            dist/reference/
          if-no-files-found: error
          retention-days: 7

  # Runs on the self-hosted runner of the environment's machine, which only
  # makes outbound connections (ADR-0011, docs/08).
  deploy:
    needs: verify
    runs-on: [self-hosted, "colorwheel-${{ inputs.environment }}"]
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SITE_ORIGIN }}
    # A deploy is never cancelled halfway; the next one waits.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/web/deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
      - run: apps/web/deploy/deploy.sh "$ENVIRONMENT" apps/web/dist dist/reference "$GITHUB_SHA" "$SITE_ORIGIN"
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}

  # Once the new version is served and checked, its release tag, which
  # protects its IDs (docs/03 §7, ADR-0028). The only job that writes.
  tag-release:
    if: inputs.tag-release
    needs: deploy
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    # One at a time, so that two releases of a day get different numbers.
    concurrency:
      group: tag-release
      cancel-in-progress: false
    steps:
      # Full history and tags, to number the release; and the credentials,
      # to push its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # A deploy run again on the same commit keeps its tag.
      - run: |
          existing="$(git tag --points-at "$GITHUB_SHA" --list 'release/*')"
          if [[ -n "$existing" ]]; then
            echo "$GITHUB_SHA is already $existing"
            exit 0
          fi
          tag="$(pnpm --filter @chromatic-wheel/catalog-builder --silent next-release-tag)"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Tagged $GITHUB_SHA as $tag"
