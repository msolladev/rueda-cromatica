name: CI

on:
  pull_request:
    branches: [main, preprod]
  # Each push to a deployed branch is verified with its environment's origin
  # and, if it passes, deployed to that environment (deploy.yml).
  push:
    branches: [preprod, main]

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: build-catalog compares the IDs with the
          # catalog of the latest release tag (docs/03 §7).
          fetch-depth: 0
      - uses: ./.github/actions/verify

  # Each deployed branch, verified with its environment's origin and
  # deployed if it passes (docs/08).
  preprod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/preprod'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preprod

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production

  # Once the new version is served and checked, its release tag, which
  # protects its IDs (docs/03 §7, ADR-0028). The only job that writes.
  tag-release:
    needs: production
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    # One at a time, so that two releases of a day get different numbers.
    concurrency:
      group: tag-release
      cancel-in-progress: false
    steps:
      # Full history and tags, to number the release; and the credentials,
      # to push its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # A deploy run again on the same commit keeps its tag.
      - run: |
          existing="$(git tag --points-at "$GITHUB_SHA" --list 'release/*')"
          if [[ -n "$existing" ]]; then
            echo "$GITHUB_SHA is already $existing"
            exit 0
          fi
          tag="$(pnpm --filter @chromatic-wheel/catalog-builder --silent next-release-tag)"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Tagged $GITHUB_SHA as $tag"
