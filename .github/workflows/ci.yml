name: CI

on:
  pull_request:
    branches: [main, preprod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versión de pnpm desde `packageManager`; pnpm descarga Node según `devEngines.runtime`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Paso 4 (ADR-0011): regenera catalog.json y falla si difiere del versionado.
      - run: pnpm --filter @rueda-cromatica/catalog-builder build-catalog --check
      - run: pnpm --filter @rueda-cromatica/web build
