name: CI

on:
  pull_request:
    branches: [main, preprod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version from `packageManager`; pnpm downloads Node per `devEngines.runtime`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # API reference (ADR-0023): fails on any TypeDoc warning. Nothing is published.
      - run: pnpm docs:api

      # Chromium for the Vitest browser projects of color-wheel (ADR-0020) and
      # web, and for the end-to-end tests of web (ADR-0024), cached per
      # Playwright version (the same in every package). The system libraries it needs are not cached and
      # are always installed.
      - id: playwright
        run: echo "version=$(pnpm --filter @chromatic-wheel/color-wheel exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @chromatic-wheel/color-wheel exec playwright install --with-deps --only-shell chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @chromatic-wheel/color-wheel exec playwright install-deps chromium

      - run: pnpm test
      # Step 4 (ADR-0011): regenerates catalog.json and fails if it differs from the committed one.
      - run: pnpm --filter @chromatic-wheel/catalog-builder build-catalog --check
      - run: pnpm build
      # End-to-end tests of the built web (ADR-0024): routes, content without
      # JavaScript, offline and the new-version notice.
      - run: pnpm --filter @chromatic-wheel/web test:e2e
