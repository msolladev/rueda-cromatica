name: CI

on:
  pull_request:
    branches: [main, preprod]
  # Each push to a deployed branch is verified with its environment's origin
  # and, if it passes, deployed to that environment (deploy.yml).
  push:
    branches: [preprod]

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: build-catalog compares the IDs with the
          # catalog of the latest release/YYYY-MM-DD tag (docs/03 §7).
          fetch-depth: 0
      - uses: ./.github/actions/verify

  # Each deployed branch, verified with its environment's origin and
  # deployed if it passes (docs/08).
  preprod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/preprod'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preprod
