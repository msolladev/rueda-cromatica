# The CI steps (ADR-0011), shared by the pull requests and the pushes to
# the deployed branches, which build with their environment's origin (docs/08). It runs
# after a checkout with the full history and the tags.
name: Verify
description: Installs, checks, tests (the API's with its PostgreSQL) and builds the monorepo, packs the API and the catalog, and deploys them with the built web to a machine of every environment, with its checks and its backups.

inputs:
  site-origin:
    description: Origin of the site's absolute URLs (SITE_ORIGIN). Empty, that of `vite preview`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # pnpm version from `packageManager`; pnpm downloads Node per `devEngines.runtime`.
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        cache: true

    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm format:check
      shell: bash
    - run: pnpm lint
      shell: bash
    - run: pnpm typecheck
      shell: bash
    # API reference (ADR-0023): fails on any TypeDoc warning. The web's server
    # serves it in /reference/.
    - run: pnpm docs:api
      shell: bash

    # Chromium for the Vitest browser projects of color-wheel (ADR-0020) and
    # web (the headless shell), and the full Chromium for the end-to-end
    # tests of web (ADR-0024), which paints like a real browser, and Firefox
    # for those of the site. Cached per
    # Playwright version (the same in every package). The system libraries it needs are not cached and
    # are always installed.
    - id: playwright
      run: echo "version=$(pnpm --filter @chromatic-wheel/color-wheel exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: pnpm --filter @chromatic-wheel/color-wheel exec playwright install --with-deps chromium firefox
      shell: bash
    - if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: pnpm --filter @chromatic-wheel/color-wheel exec playwright install-deps chromium firefox
      shell: bash

    # The PostgreSQL of the API's integration tests (docs/09 §7): the same
    # compose.yaml as in development, with the database of its .env.test.
    - run: pnpm --filter @chromatic-wheel/api db:up
      shell: bash
    - run: pnpm test
      shell: bash
    # Step 4 (ADR-0011): regenerates catalog.json and fails if it differs from the
    # committed one or breaks the ID stability (docs/03 §7).
    - run: pnpm --filter @chromatic-wheel/catalog-builder build-catalog --check
      shell: bash
    - run: |
        if [[ -n "$ORIGIN" ]]; then export SITE_ORIGIN="$ORIGIN"; fi
        pnpm build
      shell: bash
      env:
        ORIGIN: ${{ inputs.site-origin }}
    # End-to-end tests of the built web (ADR-0024): routes, content without
    # JavaScript, offline and the new-version notice.
    - run: pnpm --filter @chromatic-wheel/web test:e2e
      shell: bash

    # What the deploy builds the images from (docs/08 §2): the API with its
    # production dependencies, and the catalog pack of data/ and the latest
    # release tag, which the deploy loads into the database.
    - run: |
        apps/api/deploy/pack.sh api.tar
        pnpm --filter @chromatic-wheel/api catalog:pack catalog-pack.json
      shell: bash

    # The machine of every environment (docs/08), with this same build:
    # deploy.sh itself, on this runner, with the web's and the API's checks
    # before and after replacing the version (routes, «Page not found»,
    # redirects, cache, indexing, the API and its limit), and then the backup
    # and the restore test, with a local volume instead of the NAS.
    - run: |
        secrets="$(mktemp -d)"
        openssl rand -hex 32 >"$secrets/postgres-password"
        openssl rand -hex 32 >"$secrets/backup-password"
        chmod 444 "$secrets"/*
        export SECRETS_DIR="$secrets" COLORWHEEL_COMPOSE_FILES="$PWD/deploy/ci/compose.yaml"
        source deploy/compose.sh
        for file in apps/web/deploy/environments/*.conf; do
          environment="$(basename "$file" .conf)"
          echo "::group::Machine of $environment"
          deploy/deploy.sh "$environment" apps/web/dist dist/reference api.tar catalog-pack.json \
            "ci-$environment" http://localhost:8080
          deploy/backup/backup.sh "$environment"
          deploy/backup/restore-test.sh "$environment"
          compose --profile candidate --profile backup down --volumes
          echo "::endgroup::"
        done
      shell: bash
