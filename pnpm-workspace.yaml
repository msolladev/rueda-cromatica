packages:
  - apps/*
  - packages/*

# Direct dependencies with exact versions (ADR-0009).
savePrefix: ""

# Only versions published at least 7 days ago (in minutes).
minimumReleaseAge: 10080

# pdfjs-dist (catalog-builder) only extracts text from the charts: its native
# canvas, used to render pages, is not needed.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"

# Versions shared between packages (`catalog:` protocol).
catalog:
  "@types/culori": 4.0.1
  "@types/node": 26.6.6
  culori: 4.0.2
  prettier: 3.10.1
  typescript: 6.0.3
  vite: 8.3.8
  vitest: 5.1.0
  zod: 4.6.7
