packages:
  - apps/*
  - packages/*

# Direct dependencies with exact versions (ADR-0009).
savePrefix: ""

# Only versions published at least 7 days ago (in minutes).
minimumReleaseAge: 10080

# Versions shared between packages (`catalog:` protocol).
catalog:
  "@types/culori": 4.0.1
  "@types/node": 26.6.6
  culori: 4.0.2
  typescript: 6.0.3
  vite: 8.3.5
  vitest: 5.0.5
  zod: 4.6.7
