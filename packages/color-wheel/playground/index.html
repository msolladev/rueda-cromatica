<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Color wheel playground</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        display: grid;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      #wheel {
        width: var(--width, 100%);
        max-width: 100%;
        outline: 1px dashed #8888;
      }
      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
      }
      #log {
        max-height: 16rem;
        overflow: auto;
        margin: 0;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <h1>Color wheel playground</h1>
    <div id="wheel"></div>

    <fieldset>
      <legend>Container</legend>
      <label>
        Width
        <input id="width" type="range" min="200" max="1000" value="1000" />
      </label>
      <label>
        Locale
        <select id="locale"></select>
      </label>
      <label><input id="disabled" type="checkbox" /> Disabled</label>
    </fieldset>

    <fieldset id="controls">
      <legend>Controls (hidden / disabled)</legend>
    </fieldset>

    <fieldset>
      <legend>API</legend>
      <button id="random" type="button">Random color</button>
      <button id="save" type="button">getState</button>
      <button id="restore" type="button">setState</button>
      <button id="recreate" type="button">destroy and create</button>
    </fieldset>

    <pre id="log" aria-live="off"></pre>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
